[project]
name = "chat-rag"
version = "0.1.0"
description = "Local chat-history retrieval with cloud inference"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "dashscope>=1.24.0",
  "httpx>=0.28.0",
  "lancedb>=0.24.0",
  "openai>=1.93.0",
  "pyarrow>=20.0.0",
  "pydantic-settings>=2.10.0",
  "tenacity>=9.1.0",
  "typer>=0.16.0",
]

[project.scripts]
chat-rag = "chat_rag.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
  "pytest>=8.4.0",
  "pytest-asyncio>=1.0.0",
  "pytest-httpx>=0.35.0",
  "ruff>=0.12.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

